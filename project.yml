name: SplitGuard
options:
  bundleIdPrefix: com.bitechular
  deploymentTarget:
    iOS: "17.4"
  xcodeVersion: "27.0"
  defaultConfig: Debug

settings:
  base:
    DEVELOPMENT_TEAM: L23NTUN6KV
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    MARKETING_VERSION: "1.1.6"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  WireGuardEngine:
    path: Packages/WireGuardEngine
  SplitGuardCore:
    path: Packages/SplitGuardCore
  SplitGuardTunnel:
    path: Packages/SplitGuardTunnel

targets:
  SplitGuardNetworkExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: SplitGuardNetworkExtension/PacketTunnelProvider.swift
      - path: SplitGuardNetworkExtension/HealthAlertNotificationPoster.swift
      - path: SplitGuardNetworkExtension/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SplitGuardCore
      - package: SplitGuardTunnel
      - package: WireGuardEngine
      - sdk: NetworkExtension.framework
      - sdk: UserNotifications.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitechular.splitguard.network-extension
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: SplitGuardNetworkExtension
        INFOPLIST_FILE: SplitGuardNetworkExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: SplitGuardNetworkExtension/SplitGuardNetworkExtension.entitlements
        ENABLE_DEBUG_DYLIB: NO
        SKIP_INSTALL: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  SplitGuard:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: SplitGuard
        excludes:
          - Info.plist
          - SplitGuard.entitlements
    dependencies:
      - target: SplitGuardNetworkExtension
        embed: true
      - package: SplitGuardCore
      - package: WireGuardEngine
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitechular.splitguard
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: SplitGuard
        INFOPLIST_FILE: SplitGuard/Info.plist
        CODE_SIGN_ENTITLEMENTS: SplitGuard/SplitGuard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    postCompileScripts:
      - name: Copy Debug Verification Fixtures
        basedOnDependencyAnalysis: false
        script: |
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/DebugFixtures"
          rm -rf "$DEST"
          if [ "${CONFIGURATION}" = "Debug" ]; then
            mkdir -p "$DEST"
            for conf in "${SRCROOT}/docs/"*.conf; do
              if [ -f "$conf" ]; then
                cp "$conf" "$DEST/"
              fi
            done
          fi
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/usr/local/bin:/opt/homebrew/bin"
          if which swiftlint >/dev/null; then
            swiftlint --quiet
          else
            echo "warning: SwiftLint not installed"
          fi

schemes:
  SplitGuard:
    build:
      targets:
        SplitGuard: all
