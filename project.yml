name: SplitGuard
options:
  bundleIdPrefix: com.bitechular
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.0"
  defaultConfig: Debug

settings:
  base:
    DEVELOPMENT_TEAM: L23NTUN6KV
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  WireGuardEngine:
    path: Packages/WireGuardEngine
  SplitGuardCore:
    path: Packages/SplitGuardCore
  SplitGuardTunnel:
    path: Packages/SplitGuardTunnel

targets:
  SplitGuardNetworkExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SplitGuardNetworkExtension/PacketTunnelProvider.swift
      - path: Tools/wg-interop/Shared
      - path: SplitGuardNetworkExtension/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SplitGuardCore
      - package: SplitGuardTunnel
      - package: WireGuardEngine
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitechular.splitguard.network-extension
        PRODUCT_NAME: SplitGuardNetworkExtension
        INFOPLIST_FILE: SplitGuardNetworkExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: SplitGuardNetworkExtension/SplitGuardNetworkExtension.entitlements
        ENABLE_DEBUG_DYLIB: NO
        SKIP_INSTALL: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  SplitGuard:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SplitGuard
        excludes:
          - Info.plist
          - SplitGuard.entitlements
      - path: Tools/wg-interop/Device
      - path: Tools/wg-interop/Shared
    dependencies:
      - target: SplitGuardNetworkExtension
        embed: true
      - package: SplitGuardCore
      - package: WireGuardEngine
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitechular.splitguard
        PRODUCT_NAME: SplitGuard
        INFOPLIST_FILE: SplitGuard/Info.plist
        CODE_SIGN_ENTITLEMENTS: SplitGuard/SplitGuard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    postCompileScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/usr/local/bin:/opt/homebrew/bin"
          if which swiftlint >/dev/null; then
            swiftlint --quiet
          else
            echo "warning: SwiftLint not installed"
          fi

  SplitGuardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SplitGuardTests
    dependencies:
      - target: SplitGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitechular.splitguard.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SplitGuard.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SplitGuard"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SplitGuard:
    build:
      targets:
        SplitGuard: all
        SplitGuardTests: [test]
    test:
      targets:
        - SplitGuardTests
